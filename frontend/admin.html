<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Administrator sign in for the certificate dashboard.">
    <title>Certify | Admin sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="admin-shell">
        <header class="admin-header">
            <a class="brand" href="index.html" aria-label="CS Club certificate portal home"><img class="brand-logo"
                    src="logo.jpg" alt="CS Club logo"><span>CS Club</span></a>
            <a class="portal-link" href="index.html">Open student portal ↗</a>
        </header>
        <main class="login-screen" aria-labelledby="login-title">
            <div class="login-card">
                <p class="eyebrow">Restricted area</p>
                <h1 id="login-title">Admin<br><em>sign in.</em></h1>
                <p>Use your administrator credentials to open the certificate control room.</p>
                <form id="login-form">
                    <label for="admin-username">Admin ID</label>
                    <input id="admin-username" name="username" autocomplete="username" value="admin" required>
                    <label for="admin-password">Password</label>
                    <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
                    <button class="action-button" type="submit">Open dashboard <span>↗</span></button>
                </form>
                <p class="login-error" id="login-error" role="alert"></p>
            </div>
        </main>
    </div>
    <script src="admin.js"></script>
</body>

</html>
